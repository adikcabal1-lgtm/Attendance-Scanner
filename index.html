<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Attendance Checker
</title>


<script
  src="https://unpkg.com/html5-qrcode"
></script>


<style>

/* ============================================================
   GLOBAL
============================================================ */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f4f6f8;

  color:
    #222;

}


/* ============================================================
   HEADER
============================================================ */

.header {

  background:
    #111;

  color:
    white;

  text-align:
    center;

  padding:
    22px 15px;

}

.header h1 {

  margin:
    0;

  font-size:
    24px;

}

.header p {

  margin:
    7px 0 0;

  font-size:
    14px;

}


/* ============================================================
   CONTAINER
============================================================ */

.container {

  width:
    100%;

  max-width:
    520px;

  margin:
    auto;

  padding:
    20px;

}


/* ============================================================
   SCANNER
============================================================ */

.scanner-box {

  background:
    white;

  border-radius:
    15px;

  padding:
    15px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.12);

}

#reader {

  width:
    100%;

}


/* ============================================================
   STATUS CARD
============================================================ */

.status {

  margin-top:
    20px;

  padding:
    25px 20px;

  border-radius:
    15px;

  background:
    white;

  text-align:
    center;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.08);

  transition:
    0.2s;

}

.status h2 {

  margin:
    0 0 15px;

  font-size:
    22px;

}


/* ============================================================
   STATUS COLORS
============================================================ */

.status.success {

  background:
    #dff5e1;

  border:
    2px solid #58a95f;

}

.status.warning {

  background:
    #fff0c2;

  border:
    2px solid #e0b400;

}

.status.error {

  background:
    #ffe0e0;

  border:
    2px solid #d9534f;

}

.status.info {

  background:
    #e7f1ff;

  border:
    2px solid #6c9bd2;

}

.status.security {

  background:
    #f7e4ff;

  border:
    2px solid #a64ac9;

}


/* ============================================================
   PARTICIPANT INFORMATION
============================================================ */

.name {

  font-size:
    24px;

  font-weight:
    bold;

  margin-bottom:
    15px;

}

.info {

  font-size:
    15px;

  margin:
    7px 0;

}

.attendance-time {

  margin-top:
    15px;

  font-size:
    14px;

  font-weight:
    bold;

}


/* ============================================================
   SCAN AGAIN BUTTON
============================================================ */

.scan-again {

  margin-top:
    20px;

  padding:
    13px 25px;

  border:
    none;

  border-radius:
    8px;

  background:
    #111;

  color:
    white;

  font-size:
    15px;

  font-weight:
    bold;

  cursor:
    pointer;

}

.scan-again:hover {

  opacity:
    0.85;

}


/* ============================================================
   CAMERA ERROR
============================================================ */

.camera-help {

  margin-top:
    12px;

  font-size:
    13px;

  color:
    #666;

}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 500px) {

  .container {

    padding:
      12px;

  }

  .header h1 {

    font-size:
      21px;

  }

  .name {

    font-size:
      21px;

  }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
=========================================================== -->

<div class="header">

<h1>
ATTENDANCE CHECKER
</h1>

<p>
Secure QR Attendance Scanner
</p>

</div>


<div class="container">


<!-- ==========================================================
     SCANNER
=========================================================== -->

<div class="scanner-box">

<div id="reader"></div>

</div>


<!-- ==========================================================
     STATUS
=========================================================== -->

<div
  id="status"
  class="status info"
>

<h2>
STARTING...
</h2>

<p>
Please allow camera access.
</p>

</div>


</div>


<script>


/* ============================================================
   APPS SCRIPT API
============================================================ */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxT2If3Bsjxg_kUJPtUOwhChHocZe-lXkXX1klwXGKlw2EeNigxwTUpXEVWLolUdirs/exec";


/* ============================================================
   VARIABLES
============================================================ */

let scanner = null;

let processing = false;

let resetTimer = null;


/* ============================================================
   START CAMERA
============================================================ */

function startScanner() {

  if (
    !window.isSecureContext
  ) {

    showStatus(

      "error",

      "SECURITY ERROR",

      "Scanner must be opened through HTTPS."

    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(

      "error",

      "CAMERA NOT SUPPORTED",

      "Your browser does not support camera access."

    );

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:
        10,

      qrbox:
        {
          width:
            250,

          height:
            250
        }

    },

    function(decodedText) {

      handleQRCode(
        decodedText
      );

    },

    function(errorMessage) {

      /*
       * Normal QR scanning failures
       * are intentionally ignored.
       */

    }

  )

  .then(function() {

    showStatus(

      "info",

      "READY",

      "Scan a participant QR code."

    );

  })

  .catch(function(error) {

    showStatus(

      "error",

      "CAMERA ERROR",

      error.name +
      ": " +
      error.message +

      '<div class="camera-help">' +

      'Make sure Chrome has camera permission and try again.' +

      '</div>'

    );

  });

}


/* ============================================================
   HANDLE QR CODE
============================================================ */

function handleQRCode(
  qrData
) {

  if (
    processing
  ) {

    return;

  }


  qrData =
    String(
      qrData
    ).trim();


  if (
    !qrData
  ) {

    return;

  }


  /*
   * Expected secure QR format:
   *
   * PART-00001|signature
   */

  if (
    qrData.indexOf("|") === -1
  ) {

    processing =
      true;


    showStatus(

      "security",

      "🔒 INVALID QR CODE",

      "This QR code is not a secure participant QR code." +

      '<br><br>' +

      '<button class="scan-again" onclick="resetScanner()">' +

      'SCAN AGAIN' +

      '</button>'

    );


    return;

  }


  processing =
    true;


  showStatus(

    "info",

    "CHECKING...",

    "Verifying participant QR code..."

  );


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  const url =
    API_URL +
    "?action=scan" +
    "&data=" +
    encodeURIComponent(
      qrData
    ) +
    "&callback=" +
    callbackName;


  let script = null;


  window[callbackName] =
    function(result) {

      handleResult(
        result
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      handleError(

        "Unable to contact the attendance server."

      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  document.body.appendChild(
    script
  );

}


/* ============================================================
   CLEAN JSONP
============================================================ */

function cleanupJsonp(
  callbackName,
  script
) {

  try {

    delete window[
      callbackName
    ];

  } catch (e) {}


  if (
    script &&
    script.parentNode
  ) {

    script.parentNode.removeChild(
      script
    );

  }

}


/* ============================================================
   HANDLE RESULT
============================================================ */

function handleResult(
  result
) {

  if (
    !result
  ) {

    handleError(
      "No response received from the attendance server."
    );

    return;

  }


  if (
    result.result ===
    "SUCCESS"
  ) {

    showStatus(

      "success",

      "✓ ATTENDANCE RECORDED",

      participantInfo(
        result
      ) +

      '<button class="scan-again" onclick="resetScanner()">' +

      'SCAN NEXT PARTICIPANT' +

      '</button>'

    );

    return;

  }


  if (
    result.result ===
    "ALREADY RECORDED"
  ) {

    showStatus(

      "warning",

      "⚠ ALREADY ATTENDED",

      participantInfo(
        result
      ) +

      '<br>' +

      '<strong>This participant has already been recorded.</strong>' +

      '<br><br>' +

      '<button class="scan-again" onclick="resetScanner()">' +

      'SCAN NEXT PARTICIPANT' +

      '</button>'

    );

    return;

  }


  if (
    result.result ===
    "SECURITY ERROR"
  ) {

    showStatus(

      "security",

      "🔒 QR REJECTED",

      escapeHtml(
        result.message ||
        "This QR code failed security verification."
      ) +

      '<br><br>' +

      '<button class="scan-again" onclick="resetScanner()">' +

      'SCAN AGAIN' +

      '</button>'

    );

    return;

  }


  if (
    result.result ===
    "INVALID"
  ) {

    showStatus(

      "error",

      "✕ INVALID QR",

      escapeHtml(
        result.message ||
        "This participant QR code is invalid."
      ) +

      '<br><br>' +

      '<button class="scan-again" onclick="resetScanner()">' +

      'SCAN AGAIN' +

      '</button>'

    );

    return;

  }


  handleError(

    result.message ||
    "Unknown server response."

  );

}


/* ============================================================
   PARTICIPANT INFORMATION
============================================================ */

function participantInfo(
  result
) {

  let html =

    '<div class="name">' +

    escapeHtml(
      result.fullName ||
      "Participant"
    ) +

    '</div>' +


    '<div class="info">' +

    '<strong>Participant ID:</strong> ' +

    escapeHtml(
      result.participantId ||
      "—"
    ) +

    '</div>' +


    '<div class="info">' +

    '<strong>Barangay:</strong> ' +

    escapeHtml(
      result.barangay ||
      "—"
    ) +

    '</div>' +


    '<div class="info">' +

    '<strong>Position:</strong> ' +

    escapeHtml(
      result.position ||
      "—"
    ) +

    '</div>';


  if (
    result.timestamp
  ) {

    html +=

      '<div class="attendance-time">' +

      'Attendance Time: ' +

      escapeHtml(
        formatDate(
          result.timestamp
        )
      ) +

      '</div>';

  }


  return html;

}


/* ============================================================
   FORMAT DATE
============================================================ */

function formatDate(
  value
) {

  if (
    !value
  ) {

    return "—";

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(

    undefined,

    {

      year:
        "numeric",

      month:
        "short",

      day:
        "numeric",

      hour:
        "numeric",

      minute:
        "2-digit",

      second:
        "2-digit"

    }

  );

}


/* ============================================================
   SYSTEM ERROR
============================================================ */

function handleError(
  message
) {

  showStatus(

    "error",

    "⚠ SYSTEM ERROR",

    escapeHtml(
      message
    ) +

    '<br><br>' +

    '<button class="scan-again" onclick="resetScanner()">' +

    'TRY AGAIN' +

    '</button>'

  );

}


/* ============================================================
   SHOW STATUS
============================================================ */

function showStatus(
  type,
  title,
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status " +
    type;


  status.innerHTML =

    "<h2>" +

    title +

    "</h2>" +

    "<div>" +

    message +

    "</div>";

}


/* ============================================================
   RESET SCANNER
============================================================ */

function resetScanner() {

  if (
    resetTimer
  ) {

    clearTimeout(
      resetTimer
    );

    resetTimer =
      null;

  }


  processing =
    false;


  showStatus(

    "info",

    "READY",

    "Scan a participant QR code."

  );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   START
============================================================ */

window.addEventListener(

  "load",

  function() {

    startScanner();

  }

);

</script>


</body>

</html>
