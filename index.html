<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Attendance Checker
</title>


<script
  src="https://unpkg.com/html5-qrcode"
></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f4f6f8;

  color:
    #222;

}


/* ============================================================
   HEADER
============================================================ */

.header {

  background:
    #111;

  color:
    white;

  text-align:
    center;

  padding:
    20px;

}


.header h1 {

  margin:
    0;

  font-size:
    23px;

}


.header p {

  margin:
    7px 0 0;

  font-size:
    14px;

}


/* ============================================================
   CONTAINER
============================================================ */

.container {

  width:
    100%;

  max-width:
    500px;

  margin:
    auto;

  padding:
    20px;

}


/* ============================================================
   SESSION BOX
============================================================ */

.session-box {

  background:
    white;

  border-radius:
    15px;

  padding:
    18px;

  margin-bottom:
    15px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.12);

  text-align:
    center;

}


.session-label {

  font-size:
    12px;

  color:
    #777;

  text-transform:
    uppercase;

  letter-spacing:
    1px;

}


.session-name {

  font-size:
    22px;

  font-weight:
    bold;

  margin-top:
    7px;

}


.session-id {

  font-size:
    13px;

  color:
    #777;

  margin-top:
    4px;

}


.session-buttons {

  display:
    flex;

  gap:
    10px;

  margin-top:
    15px;

}


.session-button {

  flex:
    1;

  padding:
    12px;

  border:
    none;

  border-radius:
    8px;

  background:
    #111;

  color:
    white;

  font-weight:
    bold;

  cursor:
    pointer;

}


.session-button:active {

  transform:
    scale(0.98);

}


/* ============================================================
   SCANNER
============================================================ */

.scanner-box {

  background:
    white;

  border-radius:
    15px;

  padding:
    15px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.12);

}


#reader {

  width:
    100%;

}


/* ============================================================
   STATUS
============================================================ */

.status {

  margin-top:
    20px;

  padding:
    20px;

  border-radius:
    12px;

  background:
    white;

  text-align:
    center;

}


.status.success {

  background:
    #dff5e1;

}


.status.warning {

  background:
    #fff0c2;

}


.status.error {

  background:
    #ffe0e0;

}


.status.info {

  background:
    #e7f1ff;

}


.status.security {

  background:
    #f7e4ff;

}


.status h2 {

  margin:
    0 0 10px;

}


.name {

  font-size:
    21px;

  font-weight:
    bold;

  margin-bottom:
    10px;

}


.info {

  font-size:
    14px;

  margin:
    5px;

}


/* ============================================================
   SCAN NEXT BUTTON
============================================================ */

.next-button {

  width:
    100%;

  margin-top:
    15px;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  background:
    #111;

  color:
    white;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

  display:
    none;

}


.next-button:active {

  transform:
    scale(0.98);

}


/* ============================================================
   SESSION MODAL
============================================================ */

.modal {

  position:
    fixed;

  inset:
    0;

  background:
    rgba(0,0,0,0.55);

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  z-index:
    1000;

}


.modal-content {

  width:
    100%;

  max-width:
    430px;

  background:
    white;

  border-radius:
    15px;

  padding:
    22px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,0.25);

}


.modal-title {

  font-size:
    20px;

  font-weight:
    bold;

  margin-bottom:
    15px;

}


.session-option {

  display:
    block;

  width:
    100%;

  padding:
    15px;

  margin-bottom:
    10px;

  border:
    1px solid #ddd;

  border-radius:
    10px;

  background:
    white;

  text-align:
    left;

  cursor:
    pointer;

}


.session-option.active {

  border:
    2px solid #111;

  background:
    #f0f0f0;

}


.option-name {

  font-weight:
    bold;

}


.option-id {

  font-size:
    12px;

  color:
    #777;

  margin-top:
    4px;

}


.modal-buttons {

  display:
    flex;

  gap:
    10px;

  margin-top:
    15px;

}


.modal-button {

  flex:
    1;

  padding:
    13px;

  border:
    none;

  border-radius:
    8px;

  font-weight:
    bold;

  cursor:
    pointer;

}


.cancel-button {

  background:
    #ddd;

}


.activate-button {

  background:
    #111;

  color:
    white;

}


/* ============================================================
   MOBILE
============================================================ */

@media (
  max-width: 400px
) {

  .container {

    padding:
      12px;

  }

  .session-name {

    font-size:
      19px;

  }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
=========================================================== -->

<div class="header">

<h1>
ATTENDANCE CHECKER
</h1>

<p>
Secure QR Attendance Scanner
</p>

</div>


<div class="container">


<!-- ==========================================================
     CURRENT SESSION
=========================================================== -->

<div class="session-box">

<div class="session-label">
CURRENT SESSION
</div>


<div
  id="currentSessionName"
  class="session-name"
>
Loading...
</div>


<div
  id="currentSessionId"
  class="session-id"
>
Please wait...
</div>


<div class="session-buttons">

<button
  class="session-button"
  onclick="openSessionSelector()"
>
CHANGE SESSION
</button>

</div>

</div>


<!-- ==========================================================
     SCANNER
=========================================================== -->

<div class="scanner-box">

<div id="reader"></div>

</div>


<!-- ==========================================================
     STATUS
=========================================================== -->

<div
  id="status"
  class="status info"
>

<h2>
STARTING...
</h2>

<p>
Please allow camera access.
</p>

</div>


<!-- ==========================================================
     NEXT PARTICIPANT
=========================================================== -->

<button
  id="nextButton"
  class="next-button"
  onclick="scanNextParticipant()"
>
SCAN NEXT PARTICIPANT
</button>


</div>


<!-- ==========================================================
     SESSION MODAL
=========================================================== -->

<div
  id="sessionModal"
  class="modal"
>

<div class="modal-content">


<div class="modal-title">
SELECT ATTENDANCE SESSION
</div>


<div
  id="sessionList"
>
Loading sessions...
</div>


<div class="modal-buttons">

<button
  class="modal-button cancel-button"
  onclick="closeSessionSelector()"
>
CANCEL
</button>


<button
  class="modal-button activate-button"
  onclick="activateSelectedSession()"
>
ACTIVATE SESSION
</button>

</div>


</div>

</div>


<script>


/*
==============================================================
APPS SCRIPT API
==============================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbxT2If3Bsjxg_kUJPtUOwhChHocZe-lXkXX1klwXGKlw2EeNigxwTUpXEVWLolUdirs/exec";


/*
==============================================================
GLOBAL VARIABLES
==============================================================
*/

let scanner =
  null;


let processing =
  false;


let selectedSessionId =
  "";


let sessions =
  [];


/*
==============================================================
LOAD CURRENT SESSION
==============================================================
*/

function loadSessions() {

  const callbackName =
    "sessionsCallback_" +
    Date.now();


  const url =
    API_URL +
    "?action=sessions" +
    "&callback=" +
    callbackName;


  let script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(result) {

      if (
        result &&
        result.success
      ) {

        sessions =
          result.sessions ||
          [];


        if (
          result.activeSession
        ) {

          updateCurrentSession(
            result.activeSession
          );

        }

      }

      else {

        showStatus(
          "error",
          "SESSION ERROR",
          result.message ||
          "Unable to load sessions."
        );

      }


      cleanupJsonp(
        callbackName,
        script
      );

    };


  script.src =
    url;


  script.onerror =
    function() {

      showStatus(
        "error",
        "SESSION ERROR",
        "Unable to contact attendance server."
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  document.body.appendChild(
    script
  );

}


/*
==============================================================
UPDATE CURRENT SESSION
==============================================================
*/

function updateCurrentSession(
  session
) {

  document.getElementById(
    "currentSessionName"
  ).textContent =
    session.sessionName;


  document.getElementById(
    "currentSessionId"
  ).textContent =
    session.sessionId;

}


/*
==============================================================
OPEN SESSION SELECTOR
==============================================================
*/

function openSessionSelector() {

  const modal =
    document.getElementById(
      "sessionModal"
    );


  const list =
    document.getElementById(
      "sessionList"
    );


  list.innerHTML =
    "";


  selectedSessionId =
    "";


  if (
    !sessions.length
  ) {

    list.innerHTML =
      "<p>No sessions available.</p>";

    modal.style.display =
      "flex";

    return;

  }


  sessions.forEach(
    function(session) {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "session-option";


      if (
        session.status ===
        "ACTIVE"
      ) {

        button.classList.add(
          "active"
        );

      }


      button.innerHTML =

        '<div class="option-name">' +

        escapeHtml(
          session.sessionName
        ) +

        '</div>' +

        '<div class="option-id">' +

        escapeHtml(
          session.sessionId
        ) +

        " • " +

        escapeHtml(
          session.status
        ) +

        "</div>";


      button.onclick =
        function() {

          selectedSessionId =
            session.sessionId;


          document
            .querySelectorAll(
              ".session-option"
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );

        };


      list.appendChild(
        button
      );

    }
  );


  modal.style.display =
    "flex";

}


/*
==============================================================
CLOSE SESSION SELECTOR
==============================================================
*/

function closeSessionSelector() {

  document.getElementById(
    "sessionModal"
  ).style.display =
    "none";

}


/*
==============================================================
ACTIVATE SELECTED SESSION
==============================================================
*/

function activateSelectedSession() {

  if (
    !selectedSessionId
  ) {

    showStatus(
      "warning",
      "SELECT SESSION",
      "Please select a session first."
    );

    return;

  }


  const callbackName =
    "activateSessionCallback_" +
    Date.now();


  const url =
    API_URL +
    "?action=activateSession" +
    "&sessionId=" +
    encodeURIComponent(
      selectedSessionId
    ) +
    "&callback=" +
    callbackName;


  let script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(result) {

      if (
        result &&
        result.success
      ) {

        updateCurrentSession({

          sessionId:
            result.sessionId,

          sessionName:
            result.sessionName

        });


        closeSessionSelector();


        showStatus(
          "success",
          "SESSION ACTIVATED",
          escapeHtml(
            result.sessionName
          )
        );


        loadSessions();

      }

      else {

        showStatus(
          "error",
          "SESSION ERROR",
          result.message ||
          "Unable to activate session."
        );

      }


      cleanupJsonp(
        callbackName,
        script
      );

    };


  script.src =
    url;


  script.onerror =
    function() {

      showStatus(
        "error",
        "SYSTEM ERROR",
        "Unable to contact attendance server."
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  document.body.appendChild(
    script
  );

}


/*
==============================================================
START CAMERA
==============================================================
*/

function startScanner() {

  if (
    !window.isSecureContext
  ) {

    showStatus(
      "error",
      "SECURITY ERROR",
      "Scanner must be opened through HTTPS."
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "error",
      "CAMERA NOT SUPPORTED",
      "Your browser does not support camera access."
    );

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:
        10,

      qrbox:
        {
          width:
            250,

          height:
            250
        }

    },

    function(decodedText) {

      handleQRCode(
        decodedText
      );

    },

    function(errorMessage) {

      /*
       * Normal scanning failures
       * are ignored.
       */

    }

  )

  .then(function() {

    showStatus(
      "info",
      "READY",
      "Scan a participant QR code."
    );

  })

  .catch(function(error) {

    showStatus(
      "error",
      "CAMERA ERROR",
      error.name +
      ": " +
      error.message
    );

  });

}


/*
==============================================================
HANDLE QR CODE
==============================================================
*/

function handleQRCode(
  qrData
) {

  if (
    processing
  ) {

    return;

  }


  qrData =
    String(
      qrData
    ).trim();


  if (
    !qrData
  ) {

    return;

  }


  if (
    qrData.indexOf("|") === -1
  ) {

    processing =
      true;


    showStatus(
      "security",
      "✕ INVALID QR",
      "This QR code is not a secure participant QR code."
    );


    showNextButton();


    return;

  }


  processing =
    true;


  showStatus(
    "info",
    "CHECKING...",
    "Verifying secure participant QR..."
  );


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  const url =
    API_URL +
    "?action=scan" +
    "&data=" +
    encodeURIComponent(
      qrData
    ) +
    "&callback=" +
    callbackName;


  let script =
    null;


  window[callbackName] =
    function(result) {

      handleResult(
        result
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      handleError(
        "Unable to contact the attendance server."
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  document.body.appendChild(
    script
  );

}


/*
==============================================================
RESULT
==============================================================
*/

function handleResult(
  result
) {

  if (
    !result
  ) {

    handleError(
      "No response received."
    );

    return;

  }


  if (
    result.result ===
    "SUCCESS"
  ) {

    showStatus(

      "success",

      "✓ ATTENDANCE RECORDED",

      participantInfo(
        result
      )

    );

  }

  else if (
    result.result ===
    "ALREADY RECORDED"
  ) {

    showStatus(

      "warning",

      "⚠ ALREADY RECORDED",

      participantInfo(
        result
      )

    );

  }

  else if (
    result.result ===
    "SECURITY ERROR"
  ) {

    showStatus(

      "security",

      "🔒 QR REJECTED",

      result.message

    );

  }

  else if (
    result.result ===
    "INVALID"
  ) {

    showStatus(

      "error",

      "✕ INVALID QR",

      result.message

    );

  }

  else {

    handleError(
      result.message ||
      "Unknown server error."
    );

    return;

  }


  /*
   * Show Scan Next Participant button.
   */

  showNextButton();

}


/*
==============================================================
PARTICIPANT INFO
==============================================================
*/

function participantInfo(
  result
) {

  return (

    '<div class="name">' +

    escapeHtml(
      result.fullName
    ) +

    '</div>' +

    '<div class="info">' +

    'Barangay: ' +

    escapeHtml(
      result.barangay
    ) +

    '</div>' +

    '<div class="info">' +

    'Position: ' +

    escapeHtml(
      result.position
    ) +

    '</div>' +

    '<div class="info">' +

    'ID: ' +

    escapeHtml(
      result.participantId
    ) +

    '</div>' +

    '<div class="info">' +

    'Session: <strong>' +

    escapeHtml(
      result.session ||
      "Unknown"
    ) +

    '</strong>' +

    '</div>'

  );

}


/*
==============================================================
ERROR
==============================================================
*/

function handleError(
  message
) {

  showStatus(
    "error",
    "SYSTEM ERROR",
    message
  );


  showNextButton();

}


/*
==============================================================
STATUS
==============================================================
*/

function showStatus(
  type,
  title,
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status " +
    type;


  status.innerHTML =

    "<h2>" +
    title +
    "</h2>" +

    "<div>" +
    message +
    "</div>";

}


/*
==============================================================
SHOW NEXT BUTTON
==============================================================
*/

function showNextButton() {

  const button =
    document.getElementById(
      "nextButton"
    );


  button.style.display =
    "block";

}


/*
==============================================================
SCAN NEXT PARTICIPANT
==============================================================
*/

function scanNextParticipant() {

  processing =
    false;


  const button =
    document.getElementById(
      "nextButton"
    );


  button.style.display =
    "none";


  showStatus(
    "info",
    "READY",
    "Scan the next participant QR code."
  );

}


/*
==============================================================
CLEAN JSONP
==============================================================
*/

function cleanupJsonp(
  callbackName,
  script
) {

  try {

    delete window[
      callbackName
    ];

  }

  catch (e) {}


  if (
    script &&
    script.parentNode
  ) {

    script.parentNode.removeChild(
      script
    );

  }

}


/*
==============================================================
ESCAPE HTML
==============================================================
*/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==============================================================
START
==============================================================
*/

window.addEventListener(
  "load",
  function() {

    loadSessions();

    startScanner();

  }
);

</script>


</body>

</html>
