<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Attendance Checker
</title>


<script
  src="https://unpkg.com/html5-qrcode"
></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f4f6f8;

  color:
    #222;

}

.header {

  background:
    #111;

  color:
    white;

  text-align:
    center;

  padding:
    22px;

}

.header h1 {

  margin:
    0;

  font-size:
    23px;

}

.header p {

  margin:
    7px 0 0;

  font-size:
    14px;

}

.container {

  width:
    100%;

  max-width:
    500px;

  margin:
    auto;

  padding:
    20px;

}

.scanner-box {

  background:
    white;

  border-radius:
    15px;

  padding:
    15px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.12);

}

#reader {

  width:
    100%;

}


/* ============================================================
   STATUS
============================================================ */

.status {

  margin-top:
    20px;

  padding:
    20px;

  border-radius:
    12px;

  background:
    white;

  text-align:
    center;

}

.status.success {

  background:
    #dff5e1;

}

.status.warning {

  background:
    #fff0c2;

}

.status.error {

  background:
    #ffe0e0;

}

.status.info {

  background:
    #e7f1ff;

}

.status.security {

  background:
    #f7e4ff;

}

.status h2 {

  margin:
    0 0 10px;

}

.name {

  font-size:
    21px;

  font-weight:
    bold;

  margin-bottom:
    10px;

}

.info {

  font-size:
    14px;

  margin:
    5px;

}


/* ============================================================
   SCAN NEXT BUTTON
============================================================ */

#scanNextButton {

  display:
    none;

  width:
    100%;

  margin-top:
    15px;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  background:
    #111;

  color:
    white;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

}

#scanNextButton:hover {

  opacity:
    0.85;

}

#scanNextButton:active {

  transform:
    scale(0.98);

}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 500px) {

  .container {

    padding:
      15px;

  }

  .scanner-box {

    padding:
      10px;

  }

  .status {

    padding:
      18px;

  }

}

</style>

</head>


<body>


<div class="header">

<h1>
ATTENDANCE CHECKER
</h1>

<p>
Secure QR Attendance Scanner
</p>

</div>


<div class="container">


<div class="scanner-box">

<div id="reader"></div>

</div>


<div
  id="status"
  class="status info"
>

<h2>
STARTING...
</h2>

<p>
Please allow camera access.
</p>

</div>


<button
  id="scanNextButton"
  onclick="scanNextParticipant()"
>
SCAN NEXT PARTICIPANT
</button>


</div>


<script>


/*
==============================================================
APPS SCRIPT API
==============================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbxT2If3Bsjxg_kUJPtUOwhChHocZe-lXkXX1klwXGKlw2EeNigxwTUpXEVWLolUdirs/exec";


let scanner = null;

let processing = false;

let scannerRunning = false;


/* ============================================================
   START CAMERA / SCANNER
============================================================ */

function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (
    !window.isSecureContext
  ) {

    showStatus(
      "error",
      "SECURITY ERROR",
      "Scanner must be opened through HTTPS."
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "error",
      "CAMERA NOT SUPPORTED",
      "Your browser does not support camera access."
    );

    return;

  }


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:
        10,

      qrbox:
        {
          width:
            250,

          height:
            250
        }

    },

    function(decodedText) {

      handleQRCode(
        decodedText
      );

    },

    function(errorMessage) {

      /*
       * Normal QR scanning failures
       * are ignored.
       */

    }

  )

  .then(function() {

    scannerRunning =
      true;

    processing =
      false;


    hideScanNextButton();


    showStatus(
      "info",
      "READY",
      "Scan a participant QR code."
    );

  })

  .catch(function(error) {

    scannerRunning =
      false;


    showStatus(
      "error",
      "CAMERA ERROR",
      error.name +
      ": " +
      error.message
    );

  });

}


/* ============================================================
   HANDLE QR CODE
============================================================ */

function handleQRCode(
  qrData
) {

  if (
    processing
  ) {

    return;

  }


  qrData =
    String(
      qrData
    ).trim();


  if (
    !qrData
  ) {

    return;

  }


  /*
   * Make sure QR has secure format.
   *
   * Expected:
   *
   * PART-00001|signature
   */

  if (
    qrData.indexOf("|") === -1
  ) {

    processing =
      true;


    stopScanner();


    showStatus(
      "security",
      "✕ INVALID QR",
      "This QR code is not a secure participant QR code."
    );


    showScanNextButton();


    return;

  }


  processing =
    true;


  showStatus(
    "info",
    "CHECKING...",
    "Verifying secure participant QR..."
  );


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  const url =
    API_URL +
    "?action=scan" +
    "&data=" +
    encodeURIComponent(
      qrData
    ) +
    "&callback=" +
    callbackName;


  let script = null;


  window[callbackName] =
    function(result) {

      handleResult(
        result
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      handleError(
        "Unable to contact the attendance server."
      );


      cleanupJsonp(
        callbackName,
        script
      );

    };


  document.body.appendChild(
    script
  );

}


/* ============================================================
   STOP SCANNER
============================================================ */

function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    return Promise.resolve();

  }


  return scanner
    .stop()

    .then(function() {

      scannerRunning =
        false;

    })

    .catch(function(error) {

      console.log(
        "Scanner stop error:",
        error
      );

      scannerRunning =
        false;

    });

}


/* ============================================================
   SCAN NEXT PARTICIPANT
============================================================ */

function scanNextParticipant() {

  if (
    processing === false &&
    scannerRunning === true
  ) {

    return;

  }


  hideScanNextButton();


  processing =
    false;


  startScanner();

}


/* ============================================================
   SHOW SCAN NEXT BUTTON
============================================================ */

function showScanNextButton() {

  const button =
    document.getElementById(
      "scanNextButton"
    );


  button.style.display =
    "block";

}


/* ============================================================
   HIDE SCAN NEXT BUTTON
============================================================ */

function hideScanNextButton() {

  const button =
    document.getElementById(
      "scanNextButton"
    );


  button.style.display =
    "none";

}


/* ============================================================
   RESULT
============================================================ */

function handleResult(
  result
) {

  /*
   * Stop scanning while
   * displaying the result.
   */

  stopScanner();


  if (
    !result
  ) {

    handleError(
      "No response received."
    );

    return;

  }


  if (
    result.result ===
    "SUCCESS"
  ) {

    showStatus(

      "success",

      "✓ ATTENDANCE RECORDED",

      participantInfo(
        result
      )

    );

  }

  else if (
    result.result ===
    "ALREADY RECORDED"
  ) {

    showStatus(

      "warning",

      "⚠ ALREADY RECORDED",

      participantInfo(
        result
      )

    );

  }

  else if (
    result.result ===
    "SECURITY ERROR"
  ) {

    showStatus(

      "security",

      "🔒 QR REJECTED",

      result.message

    );

  }

  else if (
    result.result ===
    "INVALID"
  ) {

    showStatus(

      "error",

      "✕ INVALID QR",

      result.message

    );

  }

  else {

    showStatus(

      "error",

      "SYSTEM ERROR",

      result.message ||
      "Unknown server error."

    );

  }


  /*
   * Show button instead of
   * automatically scanning again.
   */

  processing =
    true;


  showScanNextButton();

}


/* ============================================================
   PARTICIPANT INFO
============================================================ */

function participantInfo(
  result
) {

  return (

    '<div class="name">' +

    escapeHtml(
      result.fullName
    ) +

    '</div>' +

    '<div class="info">' +

    'Barangay: ' +

    escapeHtml(
      result.barangay
    ) +

    '</div>' +

    '<div class="info">' +

    'Position: ' +

    escapeHtml(
      result.position
    ) +

    '</div>' +

    '<div class="info">' +

    'ID: ' +

    escapeHtml(
      result.participantId
    ) +

    '</div>'

  );

}


/* ============================================================
   ERROR
============================================================ */

function handleError(
  message
) {

  stopScanner();


  processing =
    true;


  showStatus(
    "error",
    "SYSTEM ERROR",
    message
  );


  showScanNextButton();

}


/* ============================================================
   STATUS
============================================================ */

function showStatus(
  type,
  title,
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status " +
    type;


  status.innerHTML =

    "<h2>" +
    title +
    "</h2>" +

    "<div>" +
    message +
    "</div>";

}


/* ============================================================
   CLEAN JSONP
============================================================ */

function cleanupJsonp(
  callbackName,
  script
) {

  try {

    delete window[
      callbackName
    ];

  } catch (e) {}


  if (
    script &&
    script.parentNode
  ) {

    script.parentNode.removeChild(
      script
    );

  }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   START
============================================================ */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>


</body>

</html>
